name: Pages

# 開発ブランチへの push で、検査を通ってから GitHub Pages へ配る。
on:
  push:
    branches: [claude/fervent-lamport-anoj0d]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 配信は一度にひとつ。走っている配信は途中で止めない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 単体検査（規則・時計・色算出・音・回転・本番ビルドの漏れ検査）
      - run: npm run test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
