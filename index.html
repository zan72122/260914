<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#a8dcf5">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- The status bar sits over the canvas rather than in a white strip above it,
     so a home-screen launch is edge to edge. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<!-- Wordless, including the tab. A single pictograph is the only thing that
     can go here: an empty title makes Safari fall back to the URL. -->
<title>☂</title>
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #a8dcf5;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #c {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
    background: #a8dcf5;
  }
  /* Probe element: lets script read the iOS safe-area insets in px. */
  #sa {
    position: fixed; top: 0; left: 0; width: 0; height: 0;
    pointer-events: none; visibility: hidden;
    padding-top: env(safe-area-inset-top, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
