<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.svg" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238fc7e8'/%3E%3Ccircle cx='47' cy='16' r='7' fill='%23ffd977'/%3E%3Cpath d='M6 24 Q32 34 58 24' stroke='%236b5a45' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M15 29h11l-1.5 17H16.5z' fill='%23e8615f'/%3E%3Cpath d='M30 31h11l-2 16H31z' fill='%23f2f0e8'/%3E%3Cpath d='M45 29h9l-1.5 14h-6z' fill='%237fb98a'/%3E%3C/svg%3E"
    />
    <title>. . .</title>
    <style>
      html,
      body,
      canvas#stage {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d12;
        overscroll-behavior: none;
        overscroll-behavior-y: none;
        position: fixed;
        inset: 0;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas#stage {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #safe-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        padding-top: env(safe-area-inset-top, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        pointer-events: none;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="stage"></canvas></div>
    <div id="safe-probe"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
