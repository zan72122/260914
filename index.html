<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- ホーム画面から開いたとき、Safari の枠を出さずに全画面にする -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ほんとうの火" />
    <meta name="theme-color" content="#05070d" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>ほんとうの火</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070d;
        /* スクロールのはね返りを止める（画面は一枚の世界で、スクロールしない） */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        /* iOS のアドレスバー分のずれと、指で引っぱったときの動きを殺す */
        position: fixed;
        inset: 0;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 画面は一枚の世界で、拡大も選択もしない。指の操作はすべて世界への操作。
      (function () {
        var doc = document;
        var stop = function (e) {
          e.preventDefault();
        };
        // ピンチ拡大（iOS）
        doc.addEventListener('gesturestart', stop, { passive: false });
        doc.addEventListener('gesturechange', stop, { passive: false });
        doc.addEventListener('gestureend', stop, { passive: false });
        // 長押しの選択・メニュー
        doc.addEventListener('contextmenu', stop, { passive: false });
        doc.addEventListener('selectstart', stop, { passive: false });
        // スクロールのはね返りは position:fixed と touch-action:none で起きない。
        // 二本目以降の指だけ止める（一本指のドラッグは世界に通す）。
        doc.addEventListener(
          'touchmove',
          function (e) {
            if (e.touches.length > 1) e.preventDefault();
          },
          { passive: false },
        );
        // ダブルタップ拡大
        var lastTouchEnd = 0;
        doc.addEventListener(
          'touchend',
          function (e) {
            var now = Date.now();
            if (now - lastTouchEnd <= 320) e.preventDefault();
            lastTouchEnd = now;
          },
          { passive: false },
        );
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
