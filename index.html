<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#f6dfc6" />
    <title>Monument Garden</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(180deg, #f9e4cf 0%, #f3c9c0 55%, #c9b8d8 100%);
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #fade {
        position: fixed;
        inset: 0;
        background: #fff7ea;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.9s ease;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="fade"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
