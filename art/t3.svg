<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- T3 sun. The disc sits at (725,290) so that it lands inside T1's window hole
       (x 565..885, y 140..450) when T3 is slid underneath T1. -->
  <symbol id="t3" viewBox="0 0 1000 1000">
    <defs>
      <filter id="grain-t3" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
    </defs>

    <g data-layer="bg">
      <rect x="0" y="0" width="1000" height="1000" fill="#fbf3dc"/>
    </g>

    <g data-layer="beams" opacity="0.9">
      <path d="M180 0 L470 0 L150 1000 L-140 1000 z" fill="#f6e3a8"/>
      <path d="M520 0 L740 0 L430 1000 L210 1000 z" fill="#fbeec4"/>
      <path d="M800 0 L1010 0 L700 1000 L490 1000 z" fill="#f6e3a8"/>
      <path d="M1030 240 L1120 240 L860 1000 L770 1000 z" fill="#fbeec4"/>
    </g>

    <g data-layer="sun">
      <circle cx="725" cy="290" r="104" fill="#f2c85c" stroke="#46423a" stroke-width="11"/>
      <circle cx="725" cy="290" r="72" fill="none" stroke="#e0b348" stroke-width="5"/>
      <g stroke="#46423a" stroke-width="9" stroke-linecap="round">
        <path d="M725 142 V96 M725 484 V438 M577 290 H531 M919 290 H873"/>
        <path d="M620 186 L588 154 M830 394 L862 426 M830 186 L862 154 M620 394 L588 426"/>
      </g>
    </g>

    <rect data-layer="grain" x="0" y="0" width="1000" height="1000" filter="url(#grain-t3)"
          opacity="0.1" style="mix-blend-mode:multiply" pointer-events="none"/>
  </symbol>
</svg>
