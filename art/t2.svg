<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- T2 rain cloud. The drops are cut off by the bottom edge (perceived
       incompleteness): they continue in T1's "rain" layer once T2 sits above it. -->
  <symbol id="t2" viewBox="0 0 1000 1000">
    <defs>
      <filter id="grain-t2" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
    </defs>

    <g data-layer="bg">
      <rect x="0" y="0" width="1000" height="1000" fill="#dceaf4"/>
      <g stroke="#b3c9d8" stroke-width="5" fill="none" stroke-linecap="round">
        <path d="M120 830 q60 -34 120 0"/>
        <path d="M700 890 q56 -32 112 0"/>
        <path d="M440 940 q60 -34 120 0"/>
      </g>
    </g>

    <g data-layer="cloud">
      <path d="M250 430 q-90 0 -90 -80 q0 -74 82 -84 q22 -96 128 -96 q92 0 122 78 q28 -22 66 -22 q96 0 106 100 q86 10 86 86 q0 78 -96 78 z"
            fill="#bccdd8" stroke="#46423a" stroke-width="11" stroke-linejoin="round"/>
      <path d="M296 352 q64 -36 128 -6" stroke="#9fadb6" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M520 300 q70 -40 132 -8" stroke="#9fadb6" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M250 430 q180 34 380 6 q120 -18 214 -6" stroke="#9fadb6" stroke-width="7" fill="none"/>
    </g>

    <g data-layer="rain">
      <g fill="#5fa3d2" stroke="#46423a" stroke-width="5">
        <path d="M300 500 q-13 30 0 44 q13 -14 0 -44 z"/>
        <path d="M470 560 q-13 30 0 44 q13 -14 0 -44 z"/>
        <path d="M640 520 q-13 30 0 44 q13 -14 0 -44 z"/>
        <path d="M380 690 q-13 30 0 44 q13 -14 0 -44 z"/>
        <path d="M560 760 q-13 30 0 44 q13 -14 0 -44 z"/>
        <path d="M680 700 q-13 30 0 44 q13 -14 0 -44 z"/>
        <!-- drops cut by the tile edge -->
        <path d="M220 960 q-13 30 0 44 q13 -14 0 -44 z"/>
        <path d="M300 986 q-13 30 0 44 q13 -14 0 -44 z"/>
        <path d="M380 970 q-13 30 0 44 q13 -14 0 -44 z"/>
      </g>
    </g>

    <rect data-layer="grain" x="0" y="0" width="1000" height="1000" filter="url(#grain-t2)"
          opacity="0.1" style="mix-blend-mode:multiply" pointer-events="none"/>
  </symbol>
</svg>
